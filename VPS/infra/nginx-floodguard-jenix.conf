# Nginx config for floodguard.jenix.in — FloodGuard PWA
# Deploy: copy to /etc/nginx/sites-available/floodguard.jenix.in
#         ln -s /etc/nginx/sites-available/floodguard.jenix.in /etc/nginx/sites-enabled/
#         certbot --nginx -d floodguard.jenix.in
# PWA files: copy APK/www/ contents to /var/www/floodguard-pwa/

server {
    listen 80;
    server_name floodguard.jenix.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name floodguard.jenix.in;

    ssl_certificate     /etc/letsencrypt/live/floodguard.jenix.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/floodguard.jenix.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/floodguard-pwa;
    index index.html;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"                always;
    add_header X-Content-Type-Options "nosniff"                  always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # Service worker must not be cached
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires off;
    }

    # manifest must not be cached either
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Static assets: cache 7 days
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # SPA fallback — all routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
