server {
    listen 80;
    server_name app.floodguard.jenix.in;

    root /var/www/floodguard-pwa;
    index index.html;

    # Gzip for JS/CSS/JSON
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-lived cache for Vite hashed assets (assets/index-[hash].js etc.)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker must NOT be cached so updates propagate immediately
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # manifest.json — short cache so icon/name changes apply quickly
    location = /manifest.json {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # SPA fallback: all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block direct access to source maps in production
    location ~* \.map$ {
        deny all;
    }
}
