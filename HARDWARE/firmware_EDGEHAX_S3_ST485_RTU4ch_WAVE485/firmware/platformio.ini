[platformio]
; Production: pio run -e floodguard_edgehax_s3 -t upload
; Dev bench:  pio run -e floodguard_edgehax_s3_dev -t upload
default_envs = floodguard_edgehax_s3

; ── Shared hardware settings ─────────────────────────────────────────────────
[env]
platform = espressif32
; 4d_systems_esp32s3_gen4_r8n16: variant=esp32_s3r8n16, memory_type=qio_opi,
; flash_mode=qio, 16MB — matches Edgehax ESP32-S3-WROOM-1 N16R8 exactly.
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_dtr = 0
monitor_rts = 0
board_build.partitions = partitions_16mb.csv
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5
    adafruit/Adafruit INA219@^1.2.1

; ── Production environment ───────────────────────────────────────────────────
; BLE WiFi provisioning on first boot. Device token pre-seeded per device.
[env:floodguard_edgehax_s3]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFLOODGUARD_BUILD_PROFILE=\"prod\"
    -DFIRMWARE_VERSION=\"0.1.0\"
    -DHARDWARE_VERSION=\"EH-S3-01\"
    -DDEVICE_ID_SEED=\"FG-MAIN-EH-01\"
    -DDEVICE_TOKEN_SEED=\"change_me_before_flash\"
    -DLOCATION_ID_SEED=\"RUB-SITE-01\"

; ── Dev / bench environment ──────────────────────────────────────────────────
; Hardcoded WiFi, BLE skipped. DO NOT flash to field devices.
; USB CDC disabled so Serial maps to UART0 (COM16) — full debug visibility.
[env:floodguard_edgehax_s3_dev]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DFLOODGUARD_BUILD_PROFILE=\"dev\"
    -DFIRMWARE_VERSION=\"0.1.0-dev\"
    -DHARDWARE_VERSION=\"EH-S3-01\"
    -DDEVICE_ID_SEED=\"FG-MAIN-EH-01\"
    -DDEVICE_TOKEN_SEED=\"change_me_before_flash\"
    -DLOCATION_ID_SEED=\"RUB-SITE-01\"
    -DDEV_WIFI_SSID=\"jenix123\"
    -DDEV_WIFI_PASS=\"Kherli@321\"
    -DDUMMY_DYP_MM=1000

; ── Sensor-input test environment ────────────────────────────────────────────
; DYP sensor + confirmation inputs + FSM only — no WiFi, MQTT, BLE, OTA, SD.
; Flash and watch Serial @ 115200.  pio run -e floodguard_edgehax_s3_sensor_test -t upload
[env:floodguard_edgehax_s3_sensor_test]
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DFLOODGUARD_BUILD_PROFILE=\"sensor_test\"
    -DFIRMWARE_VERSION=\"0.1.0-sensor-test\"
    -DHARDWARE_VERSION=\"EH-S3-01\"
    -DDEVICE_ID_SEED=\"FG-MAIN-EH-01\"
    -DDEVICE_TOKEN_SEED=\"change_me_before_flash\"
    -DLOCATION_ID_SEED=\"RUB-SITE-01\"
    -DSENSOR_TEST_MODE

; Generic RTU relay fallback, 2-channel module on separate left/right buses.
; Mapping: R1=siren, R2=flash. No battery ADC from the relay module.
[env:floodguard_edgehax_s3_generic_relay_2ch_backup]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DFLOODGUARD_BUILD_PROFILE=\"generic_relay_2ch_backup_dyp_max485_test\"
    -DFIRMWARE_VERSION=\"0.1.2-generic-2ch-dyp-max485-test\"
    -DHARDWARE_VERSION=\"EH-S3-01\"
    -DDEVICE_ID_SEED=\"FG-MAIN-EH-01\"
    -DDEVICE_TOKEN_SEED=\"change_me_before_flash\"
    -DLOCATION_ID_SEED=\"RUB-SITE-01\"
    -DDEV_WIFI_SSID=\"jenix123\"
    -DDEV_WIFI_PASS=\"Kherli@321\"
    -DGENERIC_REMOTE_RELAY_MODE
    -DGENERIC_REMOTE_RELAY_LEFT_ADDR=255
    -DGENERIC_REMOTE_RELAY_RIGHT_ADDR=255
    -DGENERIC_REMOTE_RELAY_LEFT_MODEL=2
    -DGENERIC_REMOTE_RELAY_RIGHT_MODEL=2

; Generic RTU relay fallback, 4-channel module on separate left/right buses.
; Mapping: R1=siren, R2=flash, R3=voice follows siren, R4=spare/future barrier.
[env:floodguard_edgehax_s3_generic_relay_4ch_backup]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DFLOODGUARD_BUILD_PROFILE=\"generic_relay_4ch_backup_dyp_max485_test\"
    -DFIRMWARE_VERSION=\"0.1.2-generic-4ch-dyp-max485-test\"
    -DHARDWARE_VERSION=\"EH-S3-01\"
    -DDEVICE_ID_SEED=\"FG-MAIN-EH-01\"
    -DDEVICE_TOKEN_SEED=\"change_me_before_flash\"
    -DLOCATION_ID_SEED=\"RUB-SITE-01\"
    -DDEV_WIFI_SSID=\"jenix123\"
    -DDEV_WIFI_PASS=\"Kherli@321\"
    -DGENERIC_REMOTE_RELAY_MODE
    -DGENERIC_REMOTE_RELAY_LEFT_ADDR=255
    -DGENERIC_REMOTE_RELAY_RIGHT_ADDR=255
    -DGENERIC_REMOTE_RELAY_LEFT_MODEL=4
    -DGENERIC_REMOTE_RELAY_RIGHT_MODEL=4

; ── ST485-C10-05-4CH + Waveshare TTL-to-RS485 (B) — PRODUCTION ───────────────
; Two ST485 boards, one per bus (left=zone A, right=zone B).
; Slave ID 1 on both buses (no collision — dedicated UART2 remap per bus).
; Waveshare auto-direction: no DE/RE pin needed (RTS=-1).
; Build: pio run -e floodguard_edgehax_s3_st485_wave485 -t upload
[env:floodguard_edgehax_s3_st485_wave485]
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DFLOODGUARD_BUILD_PROFILE=\"st485_wave485\"
    -DFIRMWARE_VERSION=\"0.2.1\"
    -DFIRMWARE_DATE=\"2026-06-22\"
    -DHARDWARE_VERSION=\"EH-S3-02\"
    -DDEVICE_ID_SEED=\"FG-MAIN-EH-01\"
    -DDEVICE_TOKEN_SEED=\"change_me_before_flash\"
    -DLOCATION_ID_SEED=\"RUB-SITE-01\"
    -DST485_RTU4CH_WAVE485_MODE

; ── ST485 + Waveshare — DEV (hardcoded WiFi, BLE skipped) ────────────────────
; DO NOT flash to field devices.
; Build: pio run -e floodguard_edgehax_s3_st485_wave485_dev -t upload
[env:floodguard_edgehax_s3_st485_wave485_dev]
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DFLOODGUARD_BUILD_PROFILE=\"st485_wave485_dev\"
    -DFIRMWARE_VERSION=\"0.2.1-dev\"
    -DFIRMWARE_DATE=\"2026-06-22d\"
    -DHARDWARE_VERSION=\"EH-S3-02\"
    -DDEVICE_ID_SEED=\"FG-MAIN-EH-01\"
    -DDEVICE_TOKEN_SEED=\"change_me_before_flash\"
    -DLOCATION_ID_SEED=\"RUB-SITE-01\"
    -DDEV_WIFI_SSID=\"jenix123\"
    -DDEV_WIFI_PASS=\"Kherli@321\"
    -DST485_RTU4CH_WAVE485_MODE

; ── Minimal MQTT test — WiFi + MQTT only, no sensors/RTU/HTTP ────────────────
; Proves whether MQTT pub/sub works in isolation.
; Build+OTA: pio run -e mqtt_test
; Re-flash main firmware via USB after test.
[env:mqtt_test]
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DMQTT_TEST_MODE
build_src_filter = -<*> +<mqtt_test_main.cpp>
lib_deps =
    knolleary/PubSubClient@^2.8
