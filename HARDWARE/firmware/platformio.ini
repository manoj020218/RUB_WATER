[platformio]
; Default build is production (BLE provisioning, no hardcoded WiFi).
; To build dev bench image:  pio run -e esp32-s3-dev
; To upload production:      pio run -e esp32-s3-prod -t upload
; To upload dev:             pio run -e esp32-s3-dev  -t upload
default_envs = esp32-s3-prod

; ─── Shared hardware settings ─────────────────────────────────────────────────
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; DTR/RTS kept at 0: USB-CDC doesn't need them. Use 1200-baud trick to capture
; boot messages (see FIRMWARE_NOTES.md §7).
monitor_dtr = 0
monitor_rts = 0
board_build.partitions = partitions.csv
; OPI PSRAM enabled: without this, 64KB loopTask stack + BLE (~70KB) exhausts
; the ~94KB internal heap and causes BTU_StartUp malloc failure (see §2, §11).
board_build.arduino.memory_type = qio_opi
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5

; ─── Production environment ───────────────────────────────────────────────────
; Flash this for field devices. BLE provisioning starts on first boot.
; To re-provision a device: hold BOOT button 5 s at power-on (factory reset).
[env:esp32-s3-prod]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFLOODGUARD_BUILD_PROFILE=\"prod\"
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; getArduinoLoopTaskStackSize() weak-symbol override in main.cpp is the
    ; reliable way to set stack size — this flag alone is silently ignored if
    ; ARDUINO_LOOP_STACK_SIZE is already defined by a framework header (see §1).
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=65536

; ─── Dev / bench environment ──────────────────────────────────────────────────
; Hardcoded WiFi for desk testing. BLE provisioning is SKIPPED (saves ~70KB RAM).
; DO NOT flash this to field devices.
[env:esp32-s3-dev]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFLOODGUARD_BUILD_PROFILE=\"dev\"
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=65536
    -DDEV_WIFI_SSID=\"jenix123\"
    -DDEV_WIFI_PASS=\"Kherli@321\"
