[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 115200
; DTR/RTS kept at 0 to prevent auto-reset on USB-JTAG serial open.
; For USB-CDC serial monitoring use the 1200-baud trick to reset/capture:
;   python -c "import serial,time; s=serial.Serial('COMXX',1200); s.dtr=True; time.sleep(0.8); s.close()"
monitor_dtr = 0
monitor_rts = 0

board_build.partitions = partitions.csv
; Enable OPI PSRAM (8MB embedded on this chip).
; Without this, the 64KB loopTask stack leaves too little heap for BLE (~70KB needed).
board_build.arduino.memory_type = qio_opi

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFLOODGUARD_BUILD_PROFILE=\"dev\"
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; CONFIG_ARDUINO_LOOP_STACK_SIZE is overridden via getArduinoLoopTaskStackSize()
    ; weak-symbol override in main.cpp — the build flag alone does NOT work because
    ; sdkconfig.h or ARDUINO_LOOP_STACK_SIZE may be defined first in the framework.
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=65536
    ; --- TEMP DEV WIFI: remove before production flash ---
    -DDEV_WIFI_SSID=\"jenix123\"
    -DDEV_WIFI_PASS=\"Kherli@321\"
